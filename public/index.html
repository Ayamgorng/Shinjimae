<!DOCTYPE html>
<html>
<head>
    <title>Shinjimae Bot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .stats { background: #f5f5f5; padding: 20px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Shinjimae Bot</h1>
    <div class="stats">
        <p id="del">Deleted Messages: 0</p>
        <p id="status">Status: Loading...</p>
    </div>
    
    <script>
        function fetchData() {
            fetch('/count')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('del').innerText = 
                        `Deleted Messages: ${data.count}`
                })
            
            fetch('/status')
                .then(res => res.json())
                .then(data => {
                    document.getElementById('status').innerText = 
                        `Status: ${data.whatsapp}`
                })
        }
        
        setInterval(fetchData, 5000)
        fetchData()
    </script>
</body>
</html>

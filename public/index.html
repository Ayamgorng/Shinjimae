<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bot Shinjimae</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <p id="del">Deleted Messages : 0</p>

  <hr>
  <h3>Auto Delete Setting</h3>
  <label>
    <input type="checkbox" id="autoDeleteToggle"> Enable Auto Delete
  </label>
  <br>
  <label>
    Interval (minutes): <input type="number" id="intervalInput" min="1" value="5">
  </label>
  <br>
  <button onclick="saveSettings()">Save Settings</button>

  <script>
    function ajax(){
      let a = new XMLHttpRequest();
      a.open("GET", "/count");
      a.send(null);
      a.onreadystatechange = function(){
        if(a.readyState === 4 && a.status === 200){
          let result = JSON.parse(a.responseText);
          document.getElementById("del").innerHTML = "Deleted Messages : " + result.count;
          setTimeout(ajax, 1000);
        }
      }
    }

    function loadSettings() {
      fetch("/config")
        .then(res => res.json())
        .then(config => {
          document.getElementById("autoDeleteToggle").checked = config.autoDelete;
          document.getElementById("intervalInput").value = config.interval;
        });
    }

    function saveSettings() {
      const config = {
        autoDelete: document.getElementById("autoDeleteToggle").checked,
        interval: parseInt(document.getElementById("intervalInput").value)
      };

      fetch("/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config)
      }).then(res => {
        if (res.ok) alert("Settings saved successfully");
        else alert("Failed to save settings");
      });
    }

    ajax();
    loadSettings();
  </script>
</body>
</html>
